name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Chaque nuit (vers 4 h, heure de Paris) : bascule « Cette semaine » des emplois du temps.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Version figée volontairement. Pour la changer : tester en local d'abord (voir MAINTENANCE.md).
  HUGO_VERSION: 0.170.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Hugo
        run: |
          curl -fsSL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/hugo
          hugo version
      # Donne au site son adresse réelle : celle de GitHub Pages, ou le domaine
      # personnalisé s'il est réglé dans Settings → Pages.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Construire le site
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
