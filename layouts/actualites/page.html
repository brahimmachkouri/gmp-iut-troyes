{{ define "main" }}
<div class="article-main shell">
  <a class="back-link" href="{{ partial "lien.html" "/actualites/" }}">← Toutes les actualités</a>
  <p class="eyebrow eyebrow-purple"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time></p>
  <h1>{{ .Title }}</h1>
  {{- with .Params.chapo }}<p class="article-lead">{{ . }}</p>{{ end }}
  {{- with .Params.image }}<img class="article-image" src="{{ partial "lien.html" . }}" alt="">{{ end }}
  <article class="prose">{{ .Content }}</article>
</div>
{{ end }}
