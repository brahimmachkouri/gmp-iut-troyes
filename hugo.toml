baseURL = "https://gmp.iut-troyes.univ-reims.fr/"
locale = "fr-FR"
defaultContentLanguage = "fr"
title = "Département GMP — IUT de Troyes"
timeZone = "Europe/Paris"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[params]
description = "Département Génie mécanique et productique de l’IUT de Troyes : ressources pédagogiques, documents, actualités et contacts."

# Menu principal. Les adresses restent fixes : ne pas les renommer.
[[menus.main]]
name = "Accueil"
pageRef = "/"
weight = 1

[[menus.main]]
name = "Emploi du temps"
pageRef = "/emploi-du-temps"
weight = 2

[[menus.main]]
name = "Actualités"
pageRef = "/actualites"
weight = 3

[[menus.main]]
name = "Ressources pédagogiques"
pageRef = "/ressources"
weight = 4

[[menus.main]]
name = "Documents"
pageRef = "/documents"
weight = 5

[[menus.main]]
name = "Contact"
pageRef = "/contact"
weight = 6

[markup.goldmark.renderer]
unsafe = false
